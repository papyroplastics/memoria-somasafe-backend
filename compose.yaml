services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql

  redis-auth:
    image: docker.io/library/redis:8-alpine
    ports:
      - ${BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6379}:6379
    volumes:
      - redis_auth_data:/data

  redis-broker:
    image: docker.io/library/redis:8-alpine
    profiles: [redis-broker]
    ports:
      - ${BIND_ADDR:-127.0.0.1}:${BROKER_PORT:-6380}:6379
    volumes:
      - redis_broker_data:/data

volumes:
  postgres_data:
  redis_auth_data:
  redis_broker_data:
